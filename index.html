<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable=no stop iOS/Android from zooming when a
         field is focused or on an accidental double-tap. All type in the app is
         >=16px so nothing is unreadable as a result. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- One per colour scheme so the solid status bar matches the page. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f5f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1512" />
    <meta name="description" content="A universal score keeper for card games." />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" keeps the page out from under the status bar. With
         "black-translucent", iOS blurs and fades whatever sits just below the
         status bar (it washed out the game name) and the home-screen app's
         viewport came up short, stranding the bottom button above the edge. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Score Keeper" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Score Keeper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
